name: Update WakaTime card

# Set the WAKATIME_TOKEN repository secret to a personal WakaTime OAuth token.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate card
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python3 scripts/update_wakatime.py
      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/wakatime.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wakatime.svg
          git commit -m 'Update WakaTime card'
          git push
