name: Update WakaTime card

on:
  schedule:
    # 12:00 UTC = 20:00 in Asia/Singapore and Asia/Shanghai.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate card
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python3 scripts/update_wakatime.py
      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/wakatime.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wakatime.svg
          git commit -m 'Update WakaTime card'
          git push
